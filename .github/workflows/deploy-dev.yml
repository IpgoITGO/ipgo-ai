name: Deploy AI to AWS dev

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional exact source commit already merged into dev; preserves the deployed baseline"
        required: false
        default: ""
        type: string
      expected_sha:
        description: "Full approved commit SHA"
        required: true
        type: string
      continuous_llm_approved:
        description: "Approve ongoing LLM; Server monthly quota waiver needs separate explicit approval"
        required: false
        default: false
        type: boolean
      llm_expires_at:
        description: "UTC deadline for new LLM calls (within 24h when enabled)"
        required: false
        default: ""
        type: string
      maintenance_approved:
        description: "One-box only: approve the brief service restart after reviewing this deployment"
        required: false
        default: false
        type: boolean
      real_capacity_approved:
        description: "Approve real one-box only after measuring memory and capacity"
        required: false
        default: false
        type: boolean
      embedded_worker_enabled:
        description: "Run a single worker inside the API task (real one-box only)"
        required: false
        default: false
        type: boolean
      llm_enabled:
        description: "Inject the OpenAI secret for real insight calls"
        required: false
        default: false
        type: boolean
      llm_approved:
        description: "Approve LLM use and its costs"
        required: false
        default: false
        type: boolean
      engine_mode:
        description: "FastAPI engine mode (use mock until the real engine is ready)"
        required: true
        default: "mock"
        type: choice
        options: ["mock", "real"]
      api_desired_count:
        description: "FastAPI service task count after deployment"
        required: true
        default: "1"
        type: choice
        options: ["0", "1", "2"]
      worker_desired_count:
        description: "SQS worker task count after deployment"
        required: true
        default: "0"
        type: choice
        options: ["0", "1", "2"]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ipgo-ai-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_ACCOUNT_ID != ''
    runs-on: ${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      DEPLOYMENT_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CONTINUOUS_LLM_APPROVED: ${{ inputs.continuous_llm_approved }}
      IPGO_LLM_EXPIRES_AT: ${{ inputs.llm_expires_at }}
      COMPUTE_MODE: ${{ vars.AWS_DEV_COMPUTE_MODE }}
      ECS_SERVICE_NAME: ${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && 'ipgo-dev-onebox-ai-api' || 'ipgo-dev-ai-api' }}
      IMAGE_TAG: ${{ inputs.source_sha || github.sha }}${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && '-arm64' || '' }}
    environment: dev
    steps:
      - name: Check deployment mode and maintenance approval
        env:
          MAINTENANCE_APPROVED: ${{ inputs.maintenance_approved }}
          ENGINE_MODE: ${{ inputs.engine_mode }}
          REAL_CAPACITY_APPROVED: ${{ inputs.real_capacity_approved }}
          EMBEDDED_WORKER_ENABLED: ${{ inputs.embedded_worker_enabled }}
          LLM_ENABLED: ${{ inputs.llm_enabled }}
          LLM_APPROVED: ${{ inputs.llm_approved }}
          API_DESIRED_COUNT: ${{ inputs.api_desired_count }}
          WORKER_DESIRED_COUNT: ${{ inputs.worker_desired_count }}
        shell: bash
        run: |
          python3 - <<'PYVALIDATE'
          import os
          from datetime import datetime, timezone
          assert os.environ['EXPECTED_SHA'] == os.environ['DEPLOYMENT_SOURCE_SHA'], 'Approved SHA mismatch'
          if os.environ.get('CONTINUOUS_LLM_APPROVED', 'false') == 'true':
              assert os.environ['LLM_ENABLED'] == 'true' and os.environ['LLM_APPROVED'] == 'true', 'Continuous LLM requires cost approval'
          if os.environ['LLM_ENABLED'] == 'true' and os.environ.get('CONTINUOUS_LLM_APPROVED', 'false') != 'true':
              end = datetime.fromisoformat(os.environ['IPGO_LLM_EXPIRES_AT'].replace('Z', '+00:00'))
              assert end.tzinfo is not None and 0 < (end-datetime.now(timezone.utc)).total_seconds() <= 86400, 'Invalid LLM expiry'
          PYVALIDATE
          if [[ "$LLM_ENABLED" == true && ( "$ENGINE_MODE" != real || "$LLM_APPROVED" != true ) ]]; then
            echo '::error::LLM requires real mode and separate LLM approval.'
            exit 1
          fi
          if [[ "$ENGINE_MODE" == mock && "$EMBEDDED_WORKER_ENABLED" == true ]]; then
            echo '::error::Mock mode cannot run an embedded worker.'
            exit 1
          fi
          case "$COMPUTE_MODE" in
            ''|legacy)
              if [ "$EMBEDDED_WORKER_ENABLED" == true ]; then
                echo '::error::Embedded worker is only supported on one-box.'
                exit 1
              fi
              ;;
            onebox)
              if [ "$MAINTENANCE_APPROVED" != true ]; then
                echo '::error::One-box deployment restarts this service. Review the image and approve maintenance first.'
                exit 1
              fi
              if [ "$WORKER_DESIRED_COUNT" != 0 ] || [ "$API_DESIRED_COUNT" -gt 1 ]; then
                echo '::error::One-box permits at most one API and zero separate workers.'
                exit 1
              fi
              if [[ "$ENGINE_MODE" == real && ( "$REAL_CAPACITY_APPROVED" != true || "$API_DESIRED_COUNT" != 1 || "$EMBEDDED_WORKER_ENABLED" != true ) ]]; then
                echo '::error::Real one-box requires measured capacity approval, one API and its embedded worker.'
                exit 1
              fi
              ;;
            *) echo '::error::AWS_DEV_COMPUTE_MODE must be onebox, legacy, or unset.'; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact approved source merged into dev
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin dev
          git merge-base --is-ancestor HEAD origin/dev

      - name: Verify approved source CI before AWS access
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.sha }}
          DEPLOYMENT_SMOKE_URL: ${{ vars.AWS_DEV_SMOKE_URL }}
          API_DESIRED_COUNT: ${{ inputs.api_desired_count }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          git cat-file -e "$WORKFLOW_SHA^{commit}"
          git show "$WORKFLOW_SHA:scripts/deployment/verify_deployment.py" > "$RUNNER_TEMP/verify_deployment.py"
          git show "$WORKFLOW_SHA:scripts/deployment/check_ecr_image.py" > "$RUNNER_TEMP/check_ecr_image.py"
          python3 "$RUNNER_TEMP/verify_deployment.py" ci --service ai
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: ipgo-ai-deploy
      - name: Check separate worker is stopped
        if: env.COMPUTE_MODE == 'onebox' && inputs.engine_mode == 'real'
        run: |
          counts="$(aws ecs describe-services --cluster ipgo-dev-cluster \
            --services ipgo-dev-ai-worker --query 'services[0].[desiredCount,runningCount,pendingCount]' --output text)"
          if [[ "$counts" != $'0\t0\t0' ]]; then
            echo '::error::The separate worker service must exist and be fully stopped before real one-box deployment.'
            exit 1
          fi
      - name: Verify AWS read prerequisites before deployment writes
        timeout-minutes: 2
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: python3 "$RUNNER_TEMP/verify_deployment.py" preflight --service ai
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
        id: login-ecr
      - name: Look up immutable SHA image
        id: image_lookup
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ipgo-dev/ai
        run: python3 "$RUNNER_TEMP/check_ecr_image.py"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: steps.image_lookup.outputs.exists == 'false'
      - name: Build and push immutable image
        if: steps.image_lookup.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: ${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && 'linux/arm64' || 'linux/amd64' }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.image_lookup.outputs.image }}
          cache-from: type=gha,scope=ai-${{ runner.arch }},timeout=60s
          cache-to: type=gha,mode=max,scope=ai-${{ runner.arch }},timeout=60s,ignore-error=true
      - name: Verify immutable image before deployment
        id: verified_image
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ipgo-dev/ai
          EXPECTED_IMAGE_DIGEST: ${{ steps.image_lookup.outputs.digest }}
        run: python3 "$RUNNER_TEMP/check_ecr_image.py" --require-present
      - name: Capture active service task definitions
        timeout-minutes: 2
        run: python3 "$RUNNER_TEMP/verify_deployment.py" snapshot --service ai
      - name: Configure API OpenAI secret
        env:
          ENGINE_MODE: ${{ inputs.engine_mode }}
          OPENAI_SECRET_ARN: ${{ vars.AWS_AI_OPENAI_SECRET_ARN }}
          LLM_ENABLED: ${{ inputs.llm_enabled }}
        run: |
          if [[ "$LLM_ENABLED" == "true" && -z "$OPENAI_SECRET_ARN" ]]; then
            echo "AWS_AI_OPENAI_SECRET_ARN is required when LLM is enabled." >&2
            exit 1
          fi

          jq \
            --arg llm_enabled "$LLM_ENABLED" \
            --arg openai_secret_arn "$OPENAI_SECRET_ARN" \
            '(.containerDefinitions[] | select(.name == "ai-api") | .secrets) |= (
              ((. // []) | map(select(.name != "OPENAI_API_KEY"))) +
              (if $llm_enabled == "true" then
                [{"name": "OPENAI_API_KEY", "valueFrom": $openai_secret_arn}]
              else
                []
              end)
            )' \
            "$RUNNER_TEMP/ai-api-task-definition.json" \
            > "$RUNNER_TEMP/ai-api-task-definition.next.json"
          mv \
            "$RUNNER_TEMP/ai-api-task-definition.next.json" \
            "$RUNNER_TEMP/ai-api-task-definition.json"

          openai_secret_count="$(
            jq '[
              .containerDefinitions[]
              | select(.name == "ai-api")
              | .secrets[]?
              | select(.name == "OPENAI_API_KEY")
            ] | length' "$RUNNER_TEMP/ai-api-task-definition.json"
          )"
          if [[ "$LLM_ENABLED" != "true" && "$openai_secret_count" != "0" ]]; then
            echo "OPENAI_API_KEY must not be injected when LLM is disabled." >&2
            exit 1
          fi
          if [[ "$LLM_ENABLED" == "true" && "$openai_secret_count" != "1" ]]; then
            echo "OPENAI_API_KEY must be injected exactly once when LLM is enabled." >&2
            exit 1
          fi
      - name: Render API task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7
        with:
          task-definition: ${{ runner.temp }}/ai-api-task-definition.json
          container-name: ai-api
          image: ${{ steps.verified_image.outputs.image }}
          environment-variables: |
            IPGO_LLM_CONTINUOUS_ENABLED=${{ inputs.llm_enabled && inputs.continuous_llm_approved }}
            IPGO_LLM_EXPIRES_AT=${{ inputs.llm_expires_at }}
            ENGINE_MODE=${{ inputs.engine_mode }}
            IPGO_EMBEDDED_WORKER_ENABLED=${{ inputs.embedded_worker_enabled }}
      - name: Verify active template revisions before ECS writes
        timeout-minutes: 2
        run: python3 "$RUNNER_TEMP/verify_deployment.py" check-template --service ai
      - name: Configure approved one-box restart
        if: env.COMPUTE_MODE == 'onebox'
        run: |
          aws ecs update-service \
            --cluster ipgo-dev-cluster \
            --service "$ECS_SERVICE_NAME" \
            --deployment-configuration 'minimumHealthyPercent=0,maximumPercent=100' \
            >/dev/null
      - name: Deploy API task definition
        id: deploy-app
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_NAME }}
          cluster: ipgo-dev-cluster
          wait-for-service-stability: true
      - name: Render worker task definition
        if: env.COMPUTE_MODE != 'onebox'
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7
        with:
          task-definition: ${{ runner.temp }}/ai-worker-task-definition.json
          container-name: ai-worker
          image: ${{ steps.verified_image.outputs.image }}
      - name: Deploy worker task definition
        id: deploy-worker
        if: env.COMPUTE_MODE != 'onebox'
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b
        with:
          task-definition: ${{ steps.render-worker.outputs.task-definition }}
          service: ipgo-dev-ai-worker
          cluster: ipgo-dev-cluster
          wait-for-service-stability: true
      - name: Set approved task counts
        env:
          API_DESIRED_COUNT: ${{ inputs.api_desired_count }}
          WORKER_DESIRED_COUNT: ${{ inputs.worker_desired_count }}
        run: |
          aws ecs update-service \
            --cluster ipgo-dev-cluster \
            --service "$ECS_SERVICE_NAME" \
            --desired-count "$API_DESIRED_COUNT" \
            >/dev/null
          if [ "$COMPUTE_MODE" != onebox ]; then
            aws ecs update-service \
              --cluster ipgo-dev-cluster \
              --service ipgo-dev-ai-worker \
              --desired-count "$WORKER_DESIRED_COUNT" \
              >/dev/null
          fi
          aws ecs wait services-stable \
            --cluster ipgo-dev-cluster \
            --services "$ECS_SERVICE_NAME" ipgo-dev-ai-worker
      - name: Verify deployed task identity and application health
        timeout-minutes: 2
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EXPECTED_TASK_DEFINITION: ${{ steps.deploy-app.outputs.task-definition-arn }}
          EXPECTED_IMAGE: ${{ steps.verified_image.outputs.image }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.verified_image.outputs.digest }}
          DEPLOYMENT_SMOKE_URL: ${{ vars.AWS_DEV_SMOKE_URL }}
          API_DESIRED_COUNT: ${{ inputs.api_desired_count }}
          WORKER_DESIRED_COUNT: ${{ inputs.worker_desired_count }}
          EXPECTED_WORKER_TASK_DEFINITION: ${{ steps.deploy-worker.outputs.task-definition-arn }}
        run: python3 "$RUNNER_TEMP/verify_deployment.py" post --service ai
      - name: Summarize deployment timing
        if: ${{ always() && hashFiles('scripts/deployment/summarize_timing.py') != '' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
          IMAGE_REUSED: ${{ steps.image_lookup.outputs.exists }}
        run: python3 scripts/deployment/summarize_timing.py
