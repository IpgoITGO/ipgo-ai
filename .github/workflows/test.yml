name: test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements/*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build runtime image
        run: docker build --tag ipgo-ai:ci .


  arm-capacity:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build native ARM runtime image
        run: docker build --tag ipgo-ai:arm-capacity .
      - name: Check real synthetic engine within 256 MiB
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f ipgo-ai-capacity >/dev/null 2>&1 || true' EXIT
          docker create --name ipgo-ai-capacity --network none --memory 256m --memory-swap 256m --cpus 2 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -e ENGINE_MODE=real -e IPGO_EMBEDDED_WORKER_ENABLED=false \
            -v "$PWD/scripts/verify-onebox-capacity.py:/validation/probe.py:ro" \
            -v "$PWD/tests:/app/tests:ro" ipgo-ai:arm-capacity python /validation/probe.py >/dev/null
          docker start --attach ipgo-ai-capacity | tee "$RUNNER_TEMP/capacity.json"
          docker inspect ipgo-ai-capacity --format '{{json .State}}' \
            | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["ExitCode"] == 0 and not s["OOMKilled"]; print("Native ARM sample passed; no OOM")'
